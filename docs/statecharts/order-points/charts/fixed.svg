  .pele .purple rect { fill: #3c2e57; } .pele .yellow rect { fill: #573d17; }
  .pele .teal rect { fill: #174641; } .pele .tan rect { fill: #3d3127; } .pele .pink rect { fill: #57233e; }
  .pele .breaks rect { fill: #2e2021 !important; stroke: #cf2b35 !important; }
  .pele .breaks text { fill: #ff6463 !important; }
  .pele .mayBreak rect { fill: #2e2619 !important; stroke: #d0700f !important; }
  .pele .mayBreak text { fill: #ffa257 !important; }
  .pele .bugPath rect { stroke: #116dd2 !important; }
  .pele .repeats rect { stroke: #9a3fcf !important; }
}</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="500.5" y="25.6">A member's points while an order is credited and a reward is redeemed</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="457.72" y="8" width="534.37" height="112" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M457.72,44H992.09" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="724.91" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M410.72,120C410.72,135.5 197.92,135.5 197.92,151L197.92,157"/><path class="pele-marker" d="M197.92,164L194.56,156L201.28,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M410.72,120C410.72,135.5 640.94,135.5 640.94,151L640.94,157"/><path class="pele-marker" d="M640.94,164L637.58,156L644.3,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M163.67,208C163.67,217.25 110.1,217.25 110.1,226.5L110.1,418.5"/><path class="pele-marker" d="M110.1,425.5L106.74,417.5L113.46,417.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M232.18,208C232.18,217.25 321.74,217.25 321.74,226.5L321.74,284.5C321.74,344 400.94,344 400.94,403.5L400.94,409.5"/><path class="pele-marker" d="M400.94,416.5L397.58,408.5L404.3,408.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M583.12,208C583.12,217.25 534.54,217.25 534.54,226.5L534.54,284.5C534.54,348.5 193.79,348.5 193.79,412.5L193.79,418.5"/><path class="pele-marker" d="M193.79,425.5L190.43,417.5L197.15,417.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M698.76,