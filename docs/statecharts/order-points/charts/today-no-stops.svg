<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1619 921" width="1619" height="921" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><style>.pele {
  --pele-bg: #ffffff; --pele-fg: #1c1c1c; --pele-muted: #656565; --pele-line: #808080;
  --pele-surface: #fcfcfc; --pele-surface-alt: #f1f1f1; --pele-border: #c9c9c9;
}
.pele .blue rect { fill: #c3e0ff; } .pele .orange rect { fill: #f0d3bf; }
.pele .purple rect { fill: #e3d5ff; } .pele .yellow rect { fill: #f0dcbf; }
.pele .teal rect { fill: #bfe3df; } .pele .tan rect { fill: #e5d9ce; } .pele .pink rect { fill: #ffcbe6; }
.pele .breaks rect { fill: #ffecee !important; stroke: #e72e3b !important; stroke-width: 2.5px !important; }
.pele .breaks text { fill: #cd2834 !important; }
.pele .mayBreak rect { fill: #fff3e6 !important; stroke: #e8730c !important; stroke-width: 2.5px !important; }
.pele .mayBreak text { fill: #b85a06 !important; }
.pele .bugPath rect { stroke: #1680f3 !important; stroke-width: 2.5px !important; }
.pele .repeats rect { stroke: #9b35d6 !important; stroke-width: 2.5px !important; stroke-dasharray: 6 3; }
@media (prefers-color-scheme: dark) {
  .pele {
    --pele-bg: #1f1f1f; --pele-fg: #f5f5f5; --pele-muted: #acacac; --pele-line: #939393;
    --pele-surface: #121212; --pele-surface-alt: #2c2c2c; --pele-border: #4e4e4e;
  }
  .pele .blue rect { fill: #1b3857; } .pele .orange rect { fill: #573117; }
  .pele .purple rect { fill: #3c2e57; } .pele .yellow rect { fill: #573d17; }
  .pele .teal rect { fill: #174641; } .pele .tan rect { fill: #3d3127; } .pele .pink rect { fill: #57233e; }
  .pele .breaks rect { fill: #2e2021 !important; stroke: #cf2b35 !important; }
  .pele .breaks text { fill: #ff6463 !important; }
  .pele .mayBreak rect { fill: #2e2619 !important; stroke: #d0700f !important; }
  .pele .mayBreak text { fill: #ffa257 !important; }
  .pele .bugPath rect { stroke: #116dd2 !important; }
  .pele .repeats rect { stroke: #9a3fcf !important; }
}</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="809.5" y="25.6">A member's points while an order is credited and a reward is redeemed</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="564.76" y="8" width="1045.6" height="130" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M564.76,44H1610.36" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="1087.56" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M517.76,138L517.76,175"/><path class="pele-marker" d="M517.76,182L514.4,174L521.12,174Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M604.02,196C630.02,188 630.02,220 610.71,214.06"/><path class="pele-marker" d="M604.02,212L612.65,211.14L610.67,217.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M483.5,226C483.5,231.98 254.66,238.52 254.66,244.5L254.66,308"/><path class="pele-marker" d="M254.66,315L251.3,307L258.02,307Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M552.02,226C552.02,232.43 764.95,238.07 764.95,244.5L764.95,317"/><path class="pele-marker" d="M764.95,324L761.59,316L768.31,316Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M823.31,368L823.31,753C823.31,767 678.36,767 678.36,781L678.36,787"/><path class="pele-marker" d="M678.36,794L675,786L681.72,786Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M874.78,338C900.78,330 900.78,362 881.47,356.06"/><path class="pele-marker" d="M874.78,354L883.41,353.14L881.43,359.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele