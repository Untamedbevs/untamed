nce higher</tspan><tspan x="0" y="26.6">than the history (free points)</tspan></text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(517.76,131)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state tan" data-id="lg0" transform="translate(669.23,91)"><rect x="-88.47" y="-22" width="176.94" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Waiting for the order</text></g><g class="pele-node pele-state orange" data-id="lg1" transform="translate(857.72,91)"><rect x="-60.02" y="-22" width="120.03" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Order saved</text></g><g class="pele-node pele-state teal" data-id="lg2" transform="translate(1020.43,91)"><rect x="-62.7" y="-22" width="125.39" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Points added</text></g><g class="pele-node pele-state breaks" data-id="lg3" transform="translate(1223.15,91)"><rect x="-100.02" y="-31" width="200.05" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)" style="fill:#ffecee;stroke:#e72e3b;stroke-width:2.5px;"/><text class="pele-label" style="fill:#cd2834;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Breaks</tspan><tspan x="0" y="16.1">BalanceMatchesHistory</tspan></text></g><g class="pele-node pele-state bugPath" data-id="lg4" transform="translate(1478.77,91)"><rect x="-115.59" y="-31" width="231.18" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Path to the</tspan><tspan x="0" y="16.1">BalanceMatchesHistory bug</tspan></text></g></g></g></svg>