>an order delivery starts and</tspan><tspan x="724.83" y="217.9">reads the balance</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="155.95" y="246.5" width="197.43" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="254.66" y="260.4">the reward's cost goes into the</tspan><tspan x="254.66" y="278.4">history</tspan></text></g><g class="pele-edge-label" data-id="edge3"><rect x="705.32" y="254" width="119.27" height="21" rx="3" fill="var(--_bg)"/><text x="764.95" y="269.4" text-anchor="middle">the order is saved</text></g><g class="pele-edge-label" data-id="edge4"><rect x="731.2" y="479" width="184.22" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="823.31" y="492.9">the order's points go into the</tspan><tspan x="823.31" y="510.9">history</tspan></text></g><g class="pele-edge-label" data-id="edge5"><rect x="906.78" y="310" width="199.41" height="72" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1006.48" y="323.9">an order delivery starts and</tspan><tspan x="1006.48" y="341.9">reads the balance or another</tspan><tspan x="1006.48" y="359.9">delivery finds the order already</tspan><tspan x="1006.48" y="377.9">saved</tspan></text></g><g class="pele-edge-label" data-id="edge6"><rect x="195.03" y="410" width="119.27" height="21" rx="3" fill="var(--_bg)"/><text x="254.66" y="425.4" text-anchor="middle">the order is saved</text></g><g class="pele-edge-label" data-id="edge7"><rect x="615.88" y="402.5" width="197.43" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="714.59" y="416.4">the reward's cost goes into the</tspan><tspan x="714.59" y="434.4">history</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="245.12" y="716" width="197.43" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="343.84" y="729.9">the reward's 